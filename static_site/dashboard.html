<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Greeties - Greets.com</title>
    <meta name="description" content="Browse everyone taking bookings on Greets. Filter by what they do, see their rate, and book a video or voice meet.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav id="nav"></nav>

    <main class="container" style="padding-top:2.5rem;padding-bottom:4rem;">
        <div class="sec-head" style="margin-bottom:2rem;">
            <h2 id="greeting">Find someone to meet</h2>
            <p>Every person here has set their own rate and chosen how they want to talk. Pick a length when you open their profile.</p>
        </div>

        <!-- Recent bookings, shown once the demo has one -->
        <div id="bookingStrip"></div>

        <div class="toolbar">
            <div class="search">
                <span class="muted">&#128269;</span>
                <input type="search" id="searchInput" placeholder="Search by name, country or what they do" aria-label="Search Greeties">
            </div>
            <a href="auth.html#join" class="btn btn-ghost btn-sm" id="earnLink">Get paid to be met</a>
        </div>

        <div class="filters" id="filters"></div>

        <div class="grid grid-4" id="grid"></div>
        <div id="empty" style="display:none;text-align:center;padding:4rem 1rem;">
            <h3 style="margin-bottom:.5rem;">Nobody matches that yet</h3>
            <p class="muted">Try a different word, or clear the filter to see everyone.</p>
            <button class="btn btn-ghost mt-6" id="clearAll">Clear filters</button>
        </div>
    </main>

    <footer id="footer"></footer>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
