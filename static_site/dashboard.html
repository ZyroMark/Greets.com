<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Greeties - Greets.com</title>
    <meta name="description" content="Browse everyone taking bookings on Greets. Filter by what they do, see their rate, and book a video or voice meet.">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#16a34a">
    <link rel="canonical" href="https://greets-com.vercel.app/dashboard">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Greets">
    <meta property="og:title" content="Browse Greeties - Greets.com">
    <meta property="og:description" content="Browse everyone taking bookings on Greets. Filter by what they do, see their rate, and book a video or voice meet.">
    <meta property="og:url" content="https://greets-com.vercel.app/dashboard">
    <meta property="og:image" content="https://greets-com.vercel.app/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Browse Greeties - Greets.com">
    <meta name="twitter:description" content="Browse everyone taking bookings on Greets. Filter by what they do, see their rate, and book a video or voice meet.">
    <meta name="twitter:image" content="https://greets-com.vercel.app/og-image.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav id="nav"></nav>

    <main class="container" style="padding-top:3rem;padding-bottom:4rem;">
        <div class="row between wrap gap-6" style="align-items:flex-end;margin-bottom:2.4rem;">
            <div class="sec-head" style="margin-bottom:0;">
                <h2 class="h2" id="greeting">Find someone<br>to meet</h2>
                <p class="lead mt-4">Every person here sets their own rate and chooses how they want to talk.</p>
            </div>
            <span class="chip" id="resultCount"></span>
        </div>

        <!-- Recent bookings, shown once the demo has one -->
        <div id="bookingStrip"></div>

        <div class="toolbar">
            <div class="search">
                <span id="searchIcon"></span>
                <input type="search" id="searchInput" placeholder="Search by name, country or what they do" aria-label="Search Greeties">
            </div>
            <a href="auth.html#join" class="btn btn-ghost btn-sm" id="earnLink">Get paid to be met</a>
        </div>

        <div class="filters" id="filters"></div>

        <div class="grid grid-4" id="grid"></div>
        <div id="empty" style="display:none;text-align:center;padding:4.5rem 1rem;">
            <h3 style="font-size:1.4rem;margin-bottom:.6rem;">Nobody matches that yet</h3>
            <p class="muted">Try a different word, or clear the filter to see everyone.</p>
            <button class="btn btn-ghost mt-6" id="clearAll">Clear filters</button>
        </div>
    </main>

    <footer id="footer"></footer>

    <script src="js/icons.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
